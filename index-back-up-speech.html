<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#4338ca">
<title>Kari Ni Tiri - Ultimate Score Keeper</title>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body {
    min-height:100vh;
    padding:18px;
    background:linear-gradient(-45deg,#667eea,#764ba2,#43cea2,#185a9d);
    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
    -webkit-tap-highlight-color:transparent;
}

@keyframes bgMove {
    0% {background-position:0% 50%}
    50% {background-position:100% 50%}
    100% {background-position:0% 50%}
}

.container {
    max-width:1500px;
    margin:auto;
    padding:25px;
    border-radius:25px;
    background:rgba(255,255,255,.13);
    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.title {
    text-align:center;
    color:white;
    margin-bottom:25px;
}

.title h1 {font-size:38px}
.title p {margin-top:8px;opacity:.9}

.card {
    background:rgba(255,255,255,.17);
    color:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.card h3 {margin-bottom:15px}

label {
    display:block;
    font-weight:600;
    margin-bottom:10px;
}

select,input {
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    font-size:15px;
    background:white;
    color:#222;
    outline:none;
}

button {
    border:0;
    border-radius:11px;
    padding:12px 17px;
    cursor:pointer;
    color:white;
    font-weight:700;
    font-size:14px;
    touch-action:manipulation;
    transition:.2s;
}

button:hover {filter:brightness(1.08)}
button:disabled {opacity:.4;cursor:not-allowed}

.game-info,.partner-section,.stats {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-bottom:22px;
}

.player-panel {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:20px 0;
}

.player-panel input {flex:1;min-width:180px}

.add {background:#16a34a}
.round {background:#4f46e5}
.reset {background:#dc2626}
.sound-btn {background:#7c3aed}
.music-btn {background:#0f766e}
.voice-btn {background:#ea580c}
.undo-btn {background:#475569}

.partner-card-row {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:9px;
}

.partner-card-row select {
    padding:8px;
    min-width:0;
}

.red-card {color:#e11d48!important;font-weight:bold}
.black-card {color:#111!important;font-weight:bold}

.stat-card {
    background:rgba(255,255,255,.2);
    color:white;
    padding:20px;
    text-align:center;
    border-radius:17px;
}

.stat-card span {
    display:block;
    font-size:34px;
    font-weight:bold;
    margin-top:8px;
}

.dashboard {
    display:grid;
    grid-template-columns:2.5fr 1fr;
    gap:20px;
}

.table-card {
    background:white;
    border-radius:15px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

table {width:100%;border-collapse:collapse}
thead {background:#23374d;color:white}
th {padding:12px;min-width:100px}
td {padding:10px;text-align:center;border-bottom:1px solid #ddd}
tbody tr:nth-child(even) {background:#f5f7fa}
tfoot {background:#edf2f7;font-weight:bold}

.score-input {
    width:75px;
    min-width:75px;
    text-align:center;
    font-size:17px;
    padding:7px;
}

.edit-btn,.remove-btn {
    display:block;
    margin:5px auto;
    padding:5px 9px;
    font-size:11px;
}

.edit-btn {background:#64748b}
.remove-btn {background:#dc2626}

.leader {
    min-height:260px;
    border-radius:18px;
    background:linear-gradient(135deg,#43cea2,#185a9d);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.badge {
    margin-top:18px;
    background:gold;
    color:#222;
    padding:15px 20px;
    border-radius:35px;
    font-size:21px;
    font-weight:bold;
}

.rank-row {
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:9px;
    margin:5px 0;
    border-radius:9px;
    background:rgba(255,255,255,.15);
    color:white;
}

.rank-name {flex:1;text-align:left}
.rank-number,.rank-points {font-weight:bold}

.entertainment {
    margin:22px 0;
    background:rgba(20,20,50,.75);
    color:white;
    border-radius:20px;
    padding:20px;
}

.entertainment h2 {margin-bottom:15px}

.sound-controls {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
}

.sound-controls button {width:100%}

.volume-row {
    display:flex;
    align-items:center;
    gap:15px;
    margin-top:17px;
}

.volume-row input {flex:1}

.voice-status {
    margin-top:15px;
    padding:12px;
    background:rgba(255,255,255,.1);
    border-radius:10px;
    line-height:1.6;
}

.mic-indicator {
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ef4444;
    margin-right:7px;
}

.mic-indicator.active {
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
}

.activity {
    margin-top:12px;
    color:#fde68a;
    font-size:14px;
}

@media(max-width:900px) {
    .dashboard {grid-template-columns:1fr}
}

@media(max-width:600px) {
    body {padding:7px}
    .container {padding:12px}
    .title h1 {font-size:29px}
    .player-panel {flex-direction:column}
    .player-panel button {width:100%}
    .sound-controls {grid-template-columns:repeat(2,1fr)}
    .card {padding:14px}
    .partner-card-row {gap:5px}
    .partner-card-row select {font-size:12px;padding:8px 4px}
}

</style>
</head>

<body>

<div class="container">

<header class="title">

<!-- GAME SETTINGS -->

<section class="entertainment">

<script>

/* =========================================
   GLOBAL DATA
========================================= */

let players = [];
let rounds = [];
let roundCount = 0;
let currentRound = null;
let partners = [];
let partnerCards = [];
let roundLocked = true;

const STORAGE_KEY = "kariNiTiri";

const playerColors = [
"#3498db","#2ecc71","#9b59b6","#f39c12",
"#e74c3c","#16a085","#d35400","#34495e"
];

/* =========================================
   AUDIO ENGINE
   Original browser-generated sounds
========================================= */

let audioContext = null;
let masterGain = null;
let musicTimer = null;
let musicPlaying = false;
let soundEnabled = true;
let volume = 0.65;

function initAudio() {

    const AudioCtx = window.AudioContext || window.webkitAudioContext;

    if (!AudioCtx) {
        showActivity("Audio is not supported by this browser.");
        return false;
    }

    if (!audioContext) {
        audioContext = new AudioCtx();
        masterGain = audioContext.createGain();
        masterGain.gain.value = volume;
        masterGain.connect(audioContext.destination);
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    return true;
}

function tone(freq, duration, type="sine", delay=0, gain=0.2) {

    if (!soundEnabled || !initAudio()) return;

    const osc = audioContext.createOscillator();
    const amp = audioContext.createGain();

    const start = audioContext.currentTime + delay;

    osc.type = type;
    osc.frequency.setValueAtTime(freq,start);

    amp.gain.setValueAtTime(0.001,start);
    amp.gain.linearRampToValueAtTime(gain,start+0.02);
    amp.gain.exponentialRampToValueAtTime(0.001,start+duration);

    osc.connect(amp);
    amp.connect(masterGain);

    osc.start(start);
    osc.stop(start+duration+0.03);
}

function playDice() {
    tone(500,.08,"triangle",0,.25);
    tone(800,.08,"triangle",.1,.2);
    tone(1100,.2,"triangle",.2,.2);
}

function playShuffle() {
    tone(300,.12,"sawtooth",0,.08);
    tone(450,.12,"sawtooth",.15,.08);
    tone(350,.12,"sawtooth",.3,.08);
}

function playWin() {
    [523,659,784,1047].forEach((n,i)=>tone(n,.35,"triangle",i*.17,.2));
}

function playLose() {
    [440,370,300,220].forEach((n,i)=>tone(n,.3,"sawtooth",i*.2,.13));
}

function playApplause() {
    for(let i=0;i<10;i++) {
        tone(500+Math.random()*900,.08,"triangle",i*.07,.12);
    }
}

function playDrumroll() {
    for(let i=0;i<15;i++) {
        tone(100+Math.random()*60,.06,"triangle",i*.09,.12);
    }
}

function playClick() {
    tone(700,.08,"sine",0,.1);
}

/* =========================================
   CASINO-STYLE ORIGINAL BACKGROUND MUSIC
========================================= */

const melody = [
    523,659,784,659,587,698,880,698,
    523,659,784,1047,880,784,659,587
];

function musicBeat() {

    if(!musicPlaying) return;

    const index = Math.floor(Date.now()/350)%melody.length;

    tone(melody[index],.25,"triangle",0,.09);
    tone(melody[index]/2,.25,"sine",0,.05);

}

function toggleMusic() {

    initAudio();

    if(!audioContext) return;

    if(musicPlaying) {

        musicPlaying = false;
        clearInterval(musicTimer);
        musicTimer = null;

        document.getElementById("musicToggle").innerText = "▶ Casino Music";

    } else {

        musicPlaying = true;
        musicBeat();

        musicTimer = setInterval(musicBeat,350);

        document.getElementById("musicToggle").innerText = "⏸ Pause Music";

    }
}

/* =========================================
   SPEECH ANNOUNCEMENTS
========================================= */

let speechEnabled = true;

function speak(message, language="en-US") {

    if(!speechEnabled || !("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(message);

    utterance.lang = language;
    utterance.rate = 1.08;
    utterance.pitch = 1.25;
    utterance.volume = volume;

    speechSynthesis.speak(utterance);
}

function randomItem(arr) {
    return arr[Math.floor(Math.random()*arr.length)];
}

function announce(event,name="") {

    const messages = {

        newRound: [
            "Ladies and gentlemen! Next round shuru thai gayu! Let's go!",
            "Aavo aavo! Navo round! Ab maza aayega!",
            "Kem cho players! Ready for another dhamakedar round?"
        ],

        win: [
            "Wah wah! Kya baat hai! Bidder jeeti gaya! Full paisa vasool!",
            "Amazing! What a champion! Aaje toh party thase!",
            "Arey wah! Bidder won! Badha taali pado!"
        ],

        lose: [
            "Oh no! Bidder haar gaya! Koi baat nahi, agli baar pakka!",
            "Arre bhai! Yeh kya ho gaya? Better luck next time!",
            "Bidder lost! Aaje toh kismat thodi naraz chhe!"
        ],

        leader: [
            "Ladies and gentlemen! We have a new king of the table!",
            "Wah! " + name + " is the superstar! Badha taali pado!",
            name + "! Aaje toh tamaro jalwo chhe!"
        ],

        reset: [
            "Navi game! Navo josh! Chalo bhai, sharu kariye!",
            "New game! New hopes! Let's go!"
        ],

        applause: [
            "Shabash! Bahu saras!",
            "Wah wah! Ek number!",
            "Kya baat hai boss!"
        ]
    };

    const message = randomItem(messages[event] || messages.applause);

    speak(message);
}

function testAnnouncement() {
    speak("Kem cho badha? Welcome to Kari Ni Tiri! Aaje ramvani maja aavse! Let's play!");
}

/* =========================================
   UI HELPERS
========================================= */

function showActivity(message) {
    document.getElementById("activity").innerText = message;
}

function setResultButtonsEnabled(enabled) {
    document.getElementById("bidWin").disabled = !enabled;
    document.getElementById("bidLose").disabled = !enabled;
    roundLocked = !enabled;
}

/* =========================================
   INITIALIZATION
========================================= */

document.addEventListener("DOMContentLoaded",()=>{

    populateBidPoints();
    createPartnerCardSelectors();
    createPartnerNameSelectors();

    document.getElementById("addPlayer").onclick = addPlayer;
    document.getElementById("addRound").onclick = addRound;

    document.getElementById("bidWin").onclick = ()=>applyResult("WIN");
    document.getElementById("bidLose").onclick = ()=>applyResult("LOSE");

    document.getElementById("undoRound").onclick = undoLastRound;
    document.getElementById("resetGame").onclick = resetGame;

    document.getElementById("musicToggle").onclick = toggleMusic;

    document.getElementById("soundToggle").onclick = ()=>{

        soundEnabled = !soundEnabled;

        document.getElementById("soundToggle").innerText =
            soundEnabled ? "🔊 Sound ON" : "🔇 Sound OFF";

    };

    document.getElementById("testVoice").onclick = testAnnouncement;
    document.getElementById("testSound").onclick = playDice;

    document.getElementById("startVoice").onclick = startVoice;
    document.getElementById("stopVoice").onclick = stopVoice;

    document.getElementById("volume").oninput = function(){

        volume = Number(this.value)/100;

        document.getElementById("volumeValue").innerText = this.value+"%";

        if(masterGain) masterGain.gain.value = volume;

    };

    document.getElementById("playerName").addEventListener("keydown",e=>{
        if(e.key==="Enter") addPlayer();
    });

    loadGame();

});

/* =========================================
   BID POINTS
========================================= */

function populateBidPoints() {

    const select = document.getElementById("bidPoints");

    for(let i=275;i<=500;i+=5) {

        const option = document.createElement("option");

        option.value = i;
        option.textContent = i;

        select.appendChild(option);

    }
}

/* =========================================
   PLAYER MANAGEMENT
========================================= */

function addPlayer() {

    const input = document.getElementById("playerName");
    const name = input.value.trim();

    if(!name) {
        alert("Enter player name");
        return;
    }

    if(players.some(p=>p.name.toLowerCase()===name.toLowerCase())) {
        alert("Player already exists");
        return;
    }

    players.push({
        name,
        color:playerColors[players.length%playerColors.length],
        total:0
    });

    input.value="";

    refreshPlayerUI();
    renderRounds();
    saveGame();

    speak("Welcome "+name+"! Chalo game sharu kariye!");
    playClick();
}

function editPlayerName(oldName) {

    const answer = prompt("Enter new name for "+oldName+":");

    if(answer===null) return;

    const newName = answer.trim();

    if(!newName) {
        alert("Name cannot be empty");
        return;
    }

    if(players.some(p=>p.name.toLowerCase()===newName.toLowerCase())) {
        alert("Player already exists");
        return;
    }

    players.forEach(p=>{
        if(p.name===oldName) p.name=newName;
    });

    rounds.forEach(r=>{
        if(r.scores && r.scores[oldName]!==undefined) {
            r.scores[newName]=r.scores[oldName];
            delete r.scores[oldName];
        }
    });

    if(currentRound && currentRound.bidder===oldName) {
        currentRound.bidder=newName;
    }

    partners=partners.map(p=>p===oldName?newName:p);

    refreshPlayerUI();
    renderRounds();
    calculateTotals();
    saveGame();
}

function removePlayer(name) {

    if(!confirm("Remove "+name+"?")) return;

    players=players.filter(p=>p.name!==name);

    rounds.forEach(r=>{
        if(r.scores) delete r.scores[name];
        if(r.partners) r.partners=r.partners.filter(p=>p!==name);
    });

    partners=partners.filter(p=>p!==name);

    if(currentRound && currentRound.bidder===name) {
        currentRound.bidder="";
    }

    refreshPlayerUI();
    renderRounds();
    calculateTotals();
    saveGame();
}

function refreshPlayerUI() {

    buildTableHeader();
    buildTotalRow();
    updateBidderDropdown();
    refreshPartnerDropdowns();
    updateStatistics();

}

/* =========================================
   PLAYER TABLE
========================================= */

function buildTableHeader() {

    const header=document.getElementById("headerRow");

    header.innerHTML="<th>Round</th>";

    players.forEach(player=>{

        const th=document.createElement("th");

        th.style.background=player.color;

        const title=document.createElement("div");
        title.textContent=player.name;

        const edit=document.createElement("button");
        edit.className="edit-btn";
        edit.textContent="✎ Edit";
        edit.onclick=()=>editPlayerName(player.name);

        const remove=document.createElement("button");
        remove.className="remove-btn";
        remove.textContent="✖ Remove";
        remove.onclick=()=>removePlayer(player.name);

        th.append(title,edit,remove);
        header.appendChild(th);

    });
}

function buildTotalRow() {

    const row=document.getElementById("totalRow");

    row.innerHTML="<td>Total</td>";

    players.forEach(player=>{

        const cell=document.createElement("td");
        cell.id="total-"+player.name;
        cell.textContent="0";

        row.appendChild(cell);

    });
}

function updateBidderDropdown() {

    const box=document.getElementById("highestBidder");
    const old=box.value;

    box.innerHTML='<option value="">Select Player</option>';

    players.forEach(player=>{

        const option=document.createElement("option");
        option.value=player.name;
        option.textContent=player.name;

        box.appendChild(option);

    });

    box.value=old;

}

function updateStatistics() {

    document.getElementById("playerCount").textContent=players.length;
    document.getElementById("roundCount").textContent=rounds.length;

}

/* =========================================
   PARTNER MANAGEMENT
========================================= */

function createPartnerCardSelectors() {

    const container=document.getElementById("partnerCardsContainer");

    container.innerHTML="";

    const suits=[
        {symbol:"♠",name:"Spade"},
        {symbol:"♥",name:"Heart"},
        {symbol:"♦",name:"Diamond"},
        {symbol:"♣",name:"Club"}
    ];

    const ranks=["A","K","Q","J","3"];

    for(let i=0;i<4;i++) {

        const row=document.createElement("div");
        row.className="partner-card-row";

        const position=document.createElement("select");
        position.innerHTML=
            '<option value="">Select</option>'+
            '<option value="First">First</option>'+
            '<option value="Second">Second</option>';

        const suit=document.createElement("select");
        suit.innerHTML='<option value="">Color</option>';

        suits.forEach(s=>{
            const option=document.createElement("option");
            option.value=s.symbol;
            option.textContent=s.symbol+" "+s.name;
            suit.appendChild(option);
        });

        const rank=document.createElement("select");
        rank.innerHTML='<option value="">Card</option>';

        ranks.forEach(r=>{
            const option=document.createElement("option");
            option.value=r;
            option.textContent=r;
            rank.appendChild(option);
        });

        suit.onchange=()=>{
            suit.className=(suit.value==="♥"||suit.value==="♦")?"red-card":
                (suit.value==="♠"||suit.value==="♣")?"black-card":"";
            savePartnerCards();
        };

        rank.onchange=savePartnerCards;

        row.append(position,suit,rank);
        container.appendChild(row);

    }

}

function createPartnerNameSelectors() {

    const container=document.getElementById("partnerNamesContainer");

    container.innerHTML="";

    for(let i=1;i<=4;i++) {

        const select=document.createElement("select");

        select.className="partner-name";
        select.style.marginBottom="9px";

        select.innerHTML='<option value="">Partner '+i+'</option>';

        select.onchange=validatePartners;

        container.appendChild(select);

    }

    refreshPartnerDropdowns();

}

function refreshPartnerDropdowns() {

    document.querySelectorAll(".partner-name").forEach(select=>{

        const old=select.value;

        select.innerHTML='<option value="">Select Partner</option>';

        players.forEach(p=>{

            const option=document.createElement("option");
            option.value=p.name;
            option.textContent=p.name;

            select.appendChild(option);

        });

        select.value=old;

    });

}

function validatePartners() {

    const selects=[...document.querySelectorAll(".partner-name")];

    const selected=selects.map(s=>s.value).filter(Boolean);

    if(new Set(selected).size!==selected.length) {

        alert("Same player cannot be selected twice.");
        this.value="";

    }

    savePartners();

}

function savePartners() {

    partners=[...document.querySelectorAll(".partner-name")]
        .map(s=>s.value)
        .filter(Boolean);

    saveGame();

}

function savePartnerCards() {

    partnerCards=[];

    const rows=document.querySelectorAll(".partner-card-row");

    rows.forEach(row=>{

        const suit=row.querySelector("select:nth-child(2)").value;
        const rank=row.querySelector("select:nth-child(3)").value;

        partnerCards.push(suit&&rank?suit+rank:"");

    });

    saveGame();

}

/* =========================================
   ROUND MANAGEMENT
========================================= */

function addRound() {

    if(currentRound) {
        alert("Complete the current round first.");
        speak("Bhai! Pehla current round complete karo!");
        return;
    }

    if(players.length===0) {
        alert("Add players first.");
        return;
    }

    currentRound={
        number:rounds.length+1,
        bidder:"",
        bid:275,
        partners:[],
        cards:[],
        result:""
    };

    document.getElementById("highestBidder").value="";
    document.getElementById("bidPoints").value="275";

    partners=[];
    partnerCards=[];

    document.querySelectorAll(".partner-name,.partner-card-row select")
        .forEach(s=>s.value="");

    document.querySelectorAll(".partner-suit").forEach(s=>s.className="");

    renderRounds();
    setResultButtonsEnabled(true);
    saveGame();

    playShuffle();
    announce("newRound");

    showActivity("Round "+currentRound.number+" started.");

}

function prepareCurrentRound() {

    if(!currentRound) {
        alert("Add a round first.");
        return false;
    }

    currentRound.bidder=document.getElementById("highestBidder").value;
    currentRound.bid=Number(document.getElementById("bidPoints").value);
    currentRound.partners=[...partners];
    currentRound.cards=[...partnerCards];

    if(!currentRound.bidder) {
        alert("Select Highest Bidder.");
        return false;
    }

    if(currentRound.partners.includes(currentRound.bidder)) {
        alert("Bidder cannot also be a partner.");
        return false;
    }

    return true;

}

/* =========================================
   SCORING ENGINE
   Original scoring rules preserved
========================================= */

function applyResult(result) {

    if(!currentRound || roundLocked) return;

    if(!prepareCurrentRound()) return;

    if(result==="WIN") playDrumroll();
    else playLose();

    const scores={};

    players.forEach(player=>{

        let score=0;

        if(player.name===currentRound.bidder) {

            score=result==="WIN"
                ? currentRound.bid*2
                : -currentRound.bid;

        } else if(currentRound.partners.includes(player.name)) {

            score=result==="WIN"
                ? currentRound.bid
                : 0;

        } else {

            score=result==="LOSE"
                ? currentRound.bid
                : 0;

        }

        scores[player.name]=score;

    });

    rounds.push({

        number:currentRound.number,
        bidder:currentRound.bidder,
        bid:currentRound.bid,
        partners:[...currentRound.partners],
        cards:[...currentRound.cards],
        result,
        scores

    });

    currentRound=null;

    setResultButtonsEnabled(false);

    renderRounds();
    calculateTotals();
    clearRoundSelections();
    saveGame();

    if(result==="WIN") {
        playWin();
        announce("win");
    } else {
        announce("lose");
    }

    showActivity("Round completed: Bidder "+result);

}

function clearRoundSelections() {

    document.getElementById("highestBidder").value="";

    partners=[];
    partnerCards=[];

    document.querySelectorAll(".partner-name,.partner-card-row select")
        .forEach(s=>s.value="");

    document.querySelectorAll(".partner-suit").forEach(s=>s.className="");

}

/* =========================================
   RENDER ROUNDS
========================================= */

function renderRounds() {

    const tbody=document.getElementById("scoreBody");

    tbody.innerHTML="";

    rounds.forEach(round=>{

        const row=document.createElement("tr");

        const label=document.createElement("td");

        label.innerHTML="Game "+round.number+
            "<br><small>"+(round.result==="WIN"?"🏆 Bidder Won":"❌ Bidder Lost")+"</small>";

        row.appendChild(label);

        players.forEach(player=>{

            const cell=document.createElement("td");

            const input=document.createElement("input");

            input.type="number";
            input.className="score-input";
            input.readOnly=true;
            input.value=round.scores[player.name]||0;

            cell.appendChild(input);
            row.appendChild(cell);

        });

        tbody.appendChild(row);

    });

    if(currentRound) {

        const row=document.createElement("tr");

        const label=document.createElement("td");
        label.textContent="Game "+currentRound.number+" (Pending)";

        row.appendChild(label);

        players.forEach(()=>{

            const cell=document.createElement("td");
            cell.textContent="Waiting";

            row.appendChild(cell);

        });

        tbody.appendChild(row);

    }

    calculateTotals();

}

/* =========================================
   TOTALS AND LEADERBOARD
========================================= */

function calculateTotals() {

    const totals={};

    players.forEach(p=>totals[p.name]=0);

    rounds.forEach(round=>{

        players.forEach(p=>{

            totals[p.name]+=(Number(round.scores[p.name])||0);

        });

    });

    players.forEach(p=>{

        p.total=totals[p.name];

        const cell=document.getElementById("total-"+p.name);

        if(cell) cell.textContent=p.total;

    });

    const values=Object.values(totals);

    const highest=values.length?Math.max(0,...values):0;

    document.getElementById("highestScore").textContent=highest;

    updateLeader(totals);
    updateStatistics();

}

function updateLeader(totals) {

    const ranking=players.map(p=>({
        name:p.name,
        total:totals[p.name]||0
    })).sort((a,b)=>b.total-a.total);

    const badge=document.querySelector(".badge");
    const container=document.getElementById("remainingUnderLeader");

    container.innerHTML="";

    if(!ranking.length) {
        badge.textContent="No Scores Yet";
        return;
    }

    badge.innerHTML="🏆 "+ranking[0].name+
        "<br>"+ranking[0].total+" Points";

    ranking.slice(1).forEach((p,i)=>{

        const div=document.createElement("div");
        div.className="rank-row";

        const number=document.createElement("span");
        number.className="rank-number";
        number.textContent=i+2;

        const name=document.createElement("span");
        name.className="rank-name";
        name.textContent=p.name;

        const points=document.createElement("span");
        points.className="rank-points";
        points.textContent=p.total+" pts";

        div.append(number,name,points);

        container.appendChild(div);

    });

}

/* =========================================
   UNDO ROUND
========================================= */

function undoLastRound() {

    const password=prompt("Enter password to undo last round:");

    if(password===null) return;

    if(password!=="Innocent mistake") {
        alert("Incorrect password!");
        return;
    }

    if(rounds.length===0) {
        alert("No completed rounds to undo.");
        return;
    }

    if(!confirm("Undo the last completed round?")) return;

    const removed=rounds.pop();

    renderRounds();
    calculateTotals();
    saveGame();

    playLose();

    alert("Last round undone: Game "+removed.number);

}

/* =========================================
   RESET GAME
========================================= */

function resetGame() {

    const password=prompt("Enter password to reset the game:");

    if(password===null) return;

    if(password!=="Na maza aavi") {
        alert("Incorrect password!");
        return;
    }

    if(!confirm("Start a new game?")) return;

    players=[];
    rounds=[];
    currentRound=null;
    partners=[];
    partnerCards=[];

    localStorage.removeItem(STORAGE_KEY);

    refreshPlayerUI();

    document.getElementById("scoreBody").innerHTML="";
    document.getElementById("highestScore").textContent="0";
    document.getElementById("playerName").value="";

    document.querySelector(".badge").textContent="No Scores Yet";
    document.getElementById("remainingUnderLeader").innerHTML="";

    createPartnerCardSelectors();
    createPartnerNameSelectors();

    setResultButtonsEnabled(false);

    saveGame();

    playApplause();
    announce("reset");

    alert("Game reset successfully!");

}

/* =========================================
   LOCAL STORAGE
========================================= */

function saveGame() {

    const data={

        players,
        rounds,
        roundCount:rounds.length,
        currentRound,
        partners,
        partnerCards,

        bidder:document.getElementById("highestBidder").value,
        bid:document.getElementById("bidPoints").value,
        wild:document.getElementById("wildSuit").value

    };

    try {
        localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
    } catch(e) {
        console.error("Could not save game:",e);
    }

}

function loadGame() {

    try {

        const saved=localStorage.getItem(STORAGE_KEY);

        if(!saved) {
            setResultButtonsEnabled(false);
            return;
        }

        const data=JSON.parse(saved);

        players=Array.isArray(data.players)?data.players:[];
        rounds=Array.isArray(data.rounds)?data.rounds:[];
        partners=Array.isArray(data.partners)?data.partners:[];
        partnerCards=Array.isArray(data.partnerCards)?data.partnerCards:[];

        rounds.forEach(r=>{
            r.scores=r.scores||{};
            r.partners=r.partners||[];
        });

        currentRound=data.currentRound||null;

        roundCount=rounds.length;

        refreshPlayerUI();

        document.getElementById("bidPoints").value=data.bid||"275";
        document.getElementById("wildSuit").value=data.wild||"♠ Spades";

        document.getElementById("highestBidder").value=data.bidder||"";

        if(currentRound) {

            document.getElementById("highestBidder").value=currentRound.bidder||"";
            document.getElementById("bidPoints").value=currentRound.bid||275;

            setResultButtonsEnabled(true);

        } else {

            setResultButtonsEnabled(false);

        }

        document.querySelectorAll(".partner-name").forEach((select,i)=>{
            select.value=partners[i]||"";
        });

        document.querySelectorAll(".partner-card-row").forEach((row,i)=>{

            const card=partnerCards[i]||"";

            if(card) {

                const suit=card.charAt(0);
                const rank=card.slice(1);

                row.querySelector("select:nth-child(2)").value=suit;
                row.querySelector("select:nth-child(3)").value=rank;

            }

        });

        renderRounds();
        calculateTotals();

    } catch(e) {

        console.error("Could not load saved game:",e);
        alert("Saved game data could not be loaded.");

    }

}

/* =========================================
   AUTO SAVE
========================================= */

document.addEventListener("change",()=>{

    if(document.getElementById("highestBidder")) saveGame();

});

document.addEventListener("input",e=>{

    if(e.target.id==="bidPoints"||e.target.id==="wildSuit") saveGame();

});

/* =========================================
   VOICE RECOGNITION
========================================= */

const SpeechRecognition=
    window.SpeechRecognition||window.webkitSpeechRecognition;

let recognition=null;
let voiceRunning=false;
let voiceBusy=false;
let lastVoiceAction="";

if(SpeechRecognition) {

    recognition=new SpeechRecognition();

    recognition.continuous=true;
    recognition.interimResults=false;
    recognition.lang="en-US";
    recognition.maxAlternatives=1;

    recognition.onstart=()=>{

        voiceRunning=true;

        document.getElementById("micIndicator").classList.add("active");
        document.getElementById("voiceState").textContent="Listening...";

    };

    recognition.onend=()=>{

        voiceRunning=false;

        document.getElementById("micIndicator").classList.remove("active");

        if(document.getElementById("voiceState").textContent!=="Voice stopped") {
            document.getElementById("voiceState").textContent="Voice assistant ready";
        }

        if(window.voiceRestartRequested) {

            setTimeout(()=>{

                try {
                    recognition.start();
                } catch(e) {}

            },500);

        }

    };

    recognition.onerror=e=>{

        document.getElementById("voiceState").textContent="Voice error: "+e.error;

        if(e.error==="not-allowed"||e.error==="service-not-allowed") {
            window.voiceRestartRequested=false;
            alert("Please allow microphone access in your browser.");
        }

    };

    recognition.onresult=e=>{

        const result=e.results[e.results.length-1];

        if(!result.isFinal) return;

        const text=result[0].transcript.trim();

        document.getElementById("heardText").textContent="Heard: "+text;

        processVoiceCommand(text);

    };

}

function startVoice() {

    if(!recognition) {

        alert("Speech recognition is not supported in this browser. Try Chrome.");
        return;

    }

    initAudio();

    window.voiceRestartRequested=true;

    if(!voiceRunning) {

        try {
            recognition.start();
        } catch(e) {
            console.log(e);
        }

    }

    speak("Voice assistant started! Hu sambhlu chhu! Say help for commands.");

}

function stopVoice() {

    window.voiceRestartRequested=false;

    if(recognition && voiceRunning) {
        recognition.stop();
    }

    voiceRunning=false;

    document.getElementById("micIndicator").classList.remove("active");
    document.getElementById("voiceState").textContent="Voice stopped";

    speechSynthesis.cancel();

}

/* =========================================
   VOICE COMMAND PROCESSOR
========================================= */

function processVoiceCommand(raw) {

    if(voiceBusy) return;

    const text=raw.toLowerCase().replace(/[.,!?]/g," ").trim();

    if(!text) return;

    showActivity("Voice command: "+raw);

    // HELP

    if(text==="help"||text.includes("what can i say")) {

        speak("You can say: Add player, add round, bidder Rahul, bid 350, bidder won, bidder lost, who is leading, show score, or stop music.");

        return;

    }

    // MUSIC

    if(text.includes("mute music")||text.includes("stop music")||text.includes("pause music")) {

        if(musicPlaying) toggleMusic();

        speak("Music bandh kari didhu!");
        return;

    }

    if(text.includes("play music")||text.includes("start music")) {

        if(!musicPlaying) toggleMusic();

        speak("Casino music sharu!");
        return;

    }

    // SOUND

    if(text.includes("mute sound")||text.includes("sound off")) {

        soundEnabled=false;
        document.getElementById("soundToggle").textContent="🔇 Sound OFF";
        speak("Sound off.");
        return;

    }

    if(text.includes("sound on")||text.includes("unmute sound")) {

        soundEnabled=true;
        document.getElementById("soundToggle").textContent="🔊 Sound ON";
        speak("Sound on.");
        return;

    }

    // LEADER

    if(text.includes("who is leading")||text.includes("current leader")||text.includes("who is the leader")) {

        const leader=players.slice().sort((a,b)=>(b.total||0)-(a.total||0))[0];

        if(leader) {

            speak("Current leader is "+leader.name+" with "+leader.total+" points! Wah wah!");

        } else {

            speak("No players yet.");

        }

        return;

    }

    // SCORE

    if(text.includes("show score")||text.includes("read scores")||text.includes("score board")) {

        if(players.length===0) {
            speak("No players yet.");
            return;
        }

        const message=players.map(p=>p.name+" has "+(p.total||0)+" points").join(". ");

        speak(message);

        return;

    }

    // ADD ROUND

    if(text.includes("add round")||text.includes("new round")||text.includes("next round")) {

        addRound();
        return;

    }

    // BIDDER WON

    if(text.includes("bidder won")||text.includes("bidder win")||text.includes("bidder has won")) {

        if(!currentRound) {
            speak("Please start a new round first.");
            return;
        }

        if(!confirm("Voice command detected: Bidder WON. Confirm?")) return;

        applyResult("WIN");
        return;

    }

    // BIDDER LOST

    if(text.includes("bidder lost")||text.includes("bidder lose")||text.includes("bidder has lost")) {

        if(!currentRound) {
            speak("Please start a new round first.");
            return;
        }

        if(!confirm("Voice command detected: Bidder LOST. Confirm?")) return;

        applyResult("LOSE");
        return;

    }

    // SELECT BID POINTS

    const bidMatch=text.match(/(?:bid|bid points|points)\s*(\d+)/);

    if(bidMatch) {

        const value=Number(bidMatch[1]);

        if(value>=275&&value<=500&&value%5===0) {

            document.getElementById("bidPoints").value=value;
            saveGame();

            speak("Bid points set to "+value+".");

        } else {

            speak("Please select a bid between 275 and 500 in steps of 5.");

        }

        return;

    }

    // SELECT BIDDER BY PLAYER NAME

    const bidderMatch=text.match(/(?:bidder|select bidder|highest bidder)\s+(.+)/);

    if(bidderMatch) {

        const name=bidderMatch[1].trim();

        const player=players.find(p=>p.name.toLowerCase()===name);

        if(player) {

            document.getElementById("highestBidder").value=player.name;
            saveGame();

            speak(player.name+" selected as highest bidder! Wah!");

        } else {

            speak("Player not found. Please say the exact player name.");

        }

        return;

    }

    // STOP VOICE

    if(text.includes("stop listening")) {
        stopVoice();
        return;
    }

    // ADD PLAYER

    if(text.startsWith("add player ")) {

        const name=raw.trim().slice(11).trim();

        document.getElementById("playerName").value=name;

        addPlayer();

        return;

    }

    speak("Sorry, command samajh nathi padi. Say help for available commands.");

}
